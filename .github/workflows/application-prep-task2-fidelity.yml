name: Application Document Prep Task 2 fidelity
on:
  pull_request:
    paths:
      - 'assets/js/application-prep.js'
      - 'assets/js/application-prep-crop.js'
      - 'assets/js/application-prep-checks.js'
      - 'tests/application-prep-task2-fidelity-browser.mjs'
      - '.github/workflows/application-prep-task2-fidelity.yml'
  workflow_dispatch:
jobs:
  fidelity:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Task 1 and prior Task 2 validators unchanged
        run: |
          node --check assets/js/application-prep.js
          node --check tests/application-prep-task2-fidelity-browser.mjs
          node --test tests/application-prep-task1.test.mjs tests/application-prep-task1-integrity.test.mjs tests/application-prep-task2.test.mjs
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install runtime for target browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Real browser crop, image and PDF fidelity
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/application-prep-fidelity.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/application-document-prep/ >/dev/null && break || sleep 1; done
          node tests/application-prep-task2-fidelity-browser.mjs
