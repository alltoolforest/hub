name: PDF Merger Task 1 input validation
on:
  pull_request:
    paths:
      - 'assets/js/pdf-merger.js'
      - 'assets/js/pdf-merger-input.js'
      - 'assets/js/pdf.js'
      - 'tests/pdf-merger-task1*.mjs'
      - '.github/workflows/pdf-merger-task1.yml'
  workflow_dispatch:
jobs:
  pdf-merger-upload-regression:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and transactional validation
        run: |
          node --check assets/js/pdf-merger.js
          node --check assets/js/pdf-merger-input.js
          node --check assets/js/pdf.js
          node --test tests/pdf-merger-task1.test.mjs
      - name: Install ${{ matrix.browser }}
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser baseline merge and failure rollback
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pdf-merger-task1-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/pdf-merger/ >/dev/null && break || sleep 1; done
          node tests/pdf-merger-task1-browser.mjs
