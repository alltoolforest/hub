name: PDF Compressor isolated integrity and pinned source build
on:
  push:
    branches:
      - pdf-compressor-task3-integrity-foundation-20261012
      - pdf-compressor-task4-source-build-20261013
      - pdf-compressor-task5-images-20261013
  pull_request:
    paths:
      - assets/js/pdf-compressor-v2/**
      - tests/pdf-compressor-*.mjs
      - tests/pdf-compressor-*.py
      - tests/build-pdf-compressor-qpdf-wasm.sh
      - .github/workflows/pdf-compressor-integrity-source-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1
          python -m pip install reportlab==4.4.9 Pillow==12.3.0 pypdf==6.10.0 pyHanko==0.37.0
          npx playwright install --with-deps chromium
      - name: Generate independent signed and encrypted fixtures
        run: python tests/pdf-compressor-independent-fixtures.py /tmp/atf-independent-pdfs
      - name: Input integrity and adjacent compressor regression
        env:
          PDF_COMPRESSOR_INDEPENDENT_FIXTURES: /tmp/atf-independent-pdfs
        run: node --test tests/pdf-compressor-task3-input-inspector.test.mjs tests/pdf-compressor-task3-independent-inputs.test.mjs tests/pdf-compressor-task1-baseline.test.mjs tests/pdf-compressor-task3-policy.test.mjs tests/pdf-compressor-task3-image-inventory.test.mjs tests/pdf-compressor-task4-lossless.test.mjs tests/pdf-compressor-task4-invariants.test.mjs tests/pdf-compressor-task4-adapter.test.mjs tests/pdf-compressor-task4-dedup.test.mjs tests/pdf-compressor-task5-image-candidate.test.mjs tests/pdf-compressor-remediation-policy.test.mjs
      - name: Isolated browser input gate
        env:
          PDF_COMPRESSOR_INDEPENDENT_FIXTURES: /tmp/atf-independent-pdfs
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/atf-input-server.log 2>&1 &
          node tests/pdf-compressor-task3-browser.mjs
  qpdf-source-build:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned compiler and sources into disposable workspace
        if: ${{ hashFiles('assets/js/pdf-compressor-v2/vendor/qpdf/qpdf.wasm') == '' }}
        run: |
          mkdir -p /tmp/atf-qpdf-build
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git /tmp/atf-qpdf-build/emsdk
          git clone --depth 1 --branch v12.4.2 https://github.com/qpdf/qpdf.git /tmp/atf-qpdf-build/qpdf-source
          git clone --depth 1 --branch v1.3.2 https://github.com/madler/zlib.git /tmp/atf-qpdf-build/zlib-source
          git clone --depth 1 --branch 3.1.4.1 https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/atf-qpdf-build/jpeg-source
          test "$(git -C /tmp/atf-qpdf-build/emsdk rev-parse HEAD)" = 3d6d8ee910466516a53e665b86458faa81dae9ba
          /tmp/atf-qpdf-build/emsdk/emsdk install 3.1.74
          /tmp/atf-qpdf-build/emsdk/emsdk activate 3.1.74
      - name: Build isolated module from reviewed source pins
        if: ${{ hashFiles('assets/js/pdf-compressor-v2/vendor/qpdf/qpdf.wasm') == '' }}
        run: |
          source /tmp/atf-qpdf-build/emsdk/emsdk_env.sh
          bash tests/build-pdf-compressor-qpdf-wasm.sh /tmp/atf-qpdf-build /tmp/atf-qpdf-artifact
      - name: Reuse the hash-verified artifact from the confirmed pinned source build
        if: ${{ hashFiles('assets/js/pdf-compressor-v2/vendor/qpdf/qpdf.wasm') != '' }}
        run: |
          node tests/pdf-compressor-runtime-hashes.mjs
          mkdir -p /tmp/atf-qpdf-artifact
          cp assets/js/pdf-compressor-v2/vendor/qpdf/qpdf.mjs assets/js/pdf-compressor-v2/vendor/qpdf/qpdf.wasm /tmp/atf-qpdf-artifact/
      - name: Report actual version without approving production integration
        run: |
          node --input-type=module - <<'JS'
          import create from '/tmp/atf-qpdf-artifact/qpdf.mjs';
          const module=await create({noInitialRun:true});
          module.callMain(['--version']);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-compressor-qpdf-experimental-source-build
          path: /tmp/atf-qpdf-artifact
          retention-days: 7
  candidate-interface:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned interface QA tools
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1 @napi-rs/canvas@1.0.11 axe-core@4.10.3
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verified interface workflow and accessibility checks
        env:
          PDF_COMPRESSOR_BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 8766 >/tmp/pdf-interface-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/pdf-compressor-task11-browser.mjs
  experimental-large-file:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned large-file QA tools
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1 @napi-rs/canvas@1.0.11
          npx playwright install --with-deps chromium
      - name: Near-100 MB actual-content pipeline probes
        run: |
          python -m http.server 8766 >/tmp/pdf-large-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for mode in balanced strong lossless; do
            PDF_COMPRESSOR_TEST_MODE="$mode" PDF_COMPRESSOR_100MB_EVIDENCE="/tmp/pdf-large-$mode.json" node tests/pdf-compressor-100mb-experimental-browser.mjs
          done
          PDF_COMPRESSOR_TEST_ENTROPY=1 PDF_COMPRESSOR_100MB_EVIDENCE=/tmp/pdf-large-entropy.json node tests/pdf-compressor-100mb-experimental-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-compressor-experimental-large-file-evidence
          path: /tmp/pdf-large-*.json
          retention-days: 7
  lossless-output:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent QA tooling
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1
          python -m pip install reportlab==4.4.9 Pillow==12.3.0 pypdf==6.10.0 pyHanko==0.37.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify pinned runtime and generate independent inputs
        run: |
          node tests/pdf-compressor-runtime-hashes.mjs
          python tests/pdf-compressor-independent-fixtures.py /tmp/atf-independent-pdfs
      - name: Actual source-built engine outputs, graph identity, text and exact rendered pixels
        env:
          PDF_COMPRESSOR_QPDF_MODULE: assets/js/pdf-compressor-v2/vendor/qpdf/qpdf.mjs
          PDF_COMPRESSOR_INDEPENDENT_FIXTURES: /tmp/atf-independent-pdfs
        run: node tests/pdf-compressor-task4-source-gate.mjs
      - name: Module-worker and strict-CSP compatibility in three browser engines
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/atf-lossless-server.log 2>&1 &
          PDF_COMPRESSOR_BROWSER=chromium node tests/pdf-compressor-task4-worker-browser.mjs
          PDF_COMPRESSOR_BROWSER=firefox node tests/pdf-compressor-task4-worker-browser.mjs
          PDF_COMPRESSOR_BROWSER=webkit node tests/pdf-compressor-task4-worker-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-compressor-independent-lossless-output-evidence
          path: /tmp/atf-qpdf-verified-outputs
          retention-days: 7
  embedded-image-output:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser QA dependencies
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Image candidate and protected structure tests
        run: node --test tests/pdf-compressor-task5-image-candidate.test.mjs tests/pdf-compressor-task5-transform.test.mjs tests/pdf-compressor-task5-jpeg-decoder.test.mjs tests/pdf-compressor-task3-policy.test.mjs
      - name: Browser image compression and strict CSP gates
        run: |
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/atf-image-server.log 2>&1 &
          PDF_COMPRESSOR_BROWSER=chromium node tests/pdf-compressor-task5-worker-browser.mjs
          PDF_COMPRESSOR_BROWSER=firefox node tests/pdf-compressor-task5-worker-browser.mjs
          PDF_COMPRESSOR_BROWSER=webkit node tests/pdf-compressor-task5-worker-browser.mjs
  document-aware-modes:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install independent browser and render tooling
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Mode routing and combined verified engine tests
        run: |
          node --test tests/pdf-compressor-task6-policy.test.mjs
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/atf-mode-server.log 2>&1 &
          PDF_COMPRESSOR_BROWSER=chromium node tests/pdf-compressor-task6-worker-browser.mjs
          PDF_COMPRESSOR_BROWSER=firefox node tests/pdf-compressor-task6-worker-browser.mjs
          PDF_COMPRESSOR_BROWSER=webkit node tests/pdf-compressor-task6-worker-browser.mjs
  final-output-integrity:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install independent browser and render tooling
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Final output, exact text and deliberate corruption gates
        run: |
          node --test tests/pdf-compressor-task7-integrity.test.mjs
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/atf-output-server.log 2>&1 &
          PDF_COMPRESSOR_BROWSER=chromium node tests/pdf-compressor-task7-worker-browser.mjs
          PDF_COMPRESSOR_BROWSER=firefox node tests/pdf-compressor-task7-worker-browser.mjs
          PDF_COMPRESSOR_BROWSER=webkit node tests/pdf-compressor-task7-worker-browser.mjs
  file-lifecycle:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated worker QA dependencies
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Cancellation, recovery, receipts and worker cleanup
        run: |
          node --test tests/pdf-compressor-task8-session.test.mjs
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/atf-lifecycle-server.log 2>&1 &
          PDF_COMPRESSOR_BROWSER=chromium node tests/pdf-compressor-task8-browser.mjs
          PDF_COMPRESSOR_BROWSER=firefox node tests/pdf-compressor-task8-browser.mjs
          PDF_COMPRESSOR_BROWSER=webkit node tests/pdf-compressor-task8-browser.mjs
  performance-diagnostic:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned diagnostic and measurement tools
        run: |
          npm install --no-save --no-package-lock pdfjs-dist@6.3.289 playwright@1.56.1 @napi-rs/canvas@1.0.11 esbuild@0.28.2
          npx playwright install --with-deps chromium
      - name: Device budgets and initial-decode regression gates
        run: node --test tests/pdf-compressor-task10-policy.test.mjs tests/pdf-compressor-task9-security.test.mjs tests/pdf-compressor-name-escapes.test.mjs
      - name: Build and verify integrated offline diagnostic
        env:
          PDF_COMPRESSOR_MOBILE_QA_OUTPUT: /tmp/PDF_Compressor_Mobile_Engine_Test.html
        run: |
          python tests/build-pdf-compressor-mobile-qa.py
          node tests/pdf-compressor-mobile-qa-browser.mjs
          node tests/pdf-compressor-task9-browser.mjs
      - name: Synthetic size, repeated-run, managed-memory and cancellation measurements
        env:
          PDF_COMPRESSOR_MOBILE_QA_OUTPUT: /tmp/PDF_Compressor_Mobile_Engine_Test.html
          PDF_COMPRESSOR_PERFORMANCE_OUTPUT: /tmp/pdf-compressor-performance.json
        run: node tests/pdf-compressor-task10-performance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-compressor-synthetic-performance-evidence
          path: /tmp/pdf-compressor-performance.json
          retention-days: 7
