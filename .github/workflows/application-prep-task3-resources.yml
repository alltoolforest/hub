name: Application Prep Task 3 mobile reliability
on:
  pull_request:
    paths:
      - 'assets/js/application-prep.js'
      - 'assets/js/application-prep-resources.js'
      - 'tests/application-prep-task3*.mjs'
      - '.github/workflows/application-prep-task3-resources.yml'
  workflow_dispatch:
jobs:
  mobile-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and existing isolated validation
        run: |
          node --check assets/js/application-prep.js
          node --check assets/js/application-prep-resources.js
          node --check tests/application-prep-task3-browser.mjs
          node --test tests/application-prep-task1.test.mjs tests/application-prep-task1-integrity.test.mjs tests/application-prep-task2.test.mjs tests/application-prep-task3-resources.test.mjs
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install browser runtime
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Actual-browser mobile reliability and repeated exports
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/application-prep-task3-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/application-document-prep/ >/dev/null && break || sleep 1; done
          node tests/application-prep-task3-browser.mjs
