name: Image OCR final reliability and freeze gate
on:
  pull_request:
    paths:
      - 'assets/js/image-to-text-ocr.js'
      - 'assets/js/image-ocr-export.js'
      - 'assets/css/image-to-text-ocr.css'
      - 'tests/image-ocr-final-reliability-browser.mjs'
      - 'tests/image-ocr-batch.test.mjs'
      - '.github/workflows/image-ocr-final-freeze.yml'
  workflow_dispatch:
jobs:
  final-ocr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit regressions
        run: |
          node --check assets/js/image-to-text-ocr.js
          node --check assets/js/image-ocr-export.js
          node --check assets/js/image-ocr-batch.js
          node --check tests/image-ocr-final-reliability-browser.mjs
          node --test tests/image-ocr-task1.test.mjs tests/image-ocr-task2.test.mjs tests/image-ocr-batch.test.mjs
      - name: Install Playwright and local test libraries
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 fflate@0.8.2 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Browser integration and accessibility
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/image-ocr-freeze-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/image-to-text/ >/dev/null && break || sleep 1; done
          node tests/image-ocr-final-reliability-browser.mjs
          node tests/image-ocr-batch-browser.mjs
          node tests/image-ocr-task1-browser.mjs
          node tests/image-ocr-task2-browser.mjs
          node tests/image-ocr-task3-accessibility.mjs
