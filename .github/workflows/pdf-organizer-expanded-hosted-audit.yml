name: Organize PDF hosted expanded-stream acceptance (read-only)
on:
  pull_request:
    paths:
      - 'documents/pdf-organizer/browser-expanded-stream.test.mjs'
      - '.github/workflows/pdf-organizer-expanded-hosted-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-expanded:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node documents/pdf-organizer/browser-expanded-stream.test.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          ORGANIZER_DEPLOYED_URL: https://alltoolforest.github.io/hub/
