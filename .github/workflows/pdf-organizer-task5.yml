name: Organize PDF Pages — Task 5 release-candidate QA

on:
  pull_request:
    paths:
      - 'assets/js/pdf-organizer*.js'
      - 'assets/css/pdf-organizer.css'
      - 'documents/pdf-organizer/index.html'
      - 'tests/pdf-organizer-task*.mjs'
      - 'tests/pdf-organizer-removal-regression.test.mjs'
      - 'tests/pdf-organizer-postaudit.test.mjs'
      - '.github/workflows/pdf-organizer-task5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organizer-node:
    name: PDF correctness and task 1–4 regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact committed test suites
        run: node --test tests/pdf-organizer-task1.test.mjs tests/pdf-organizer-task2.test.mjs tests/pdf-organizer-task3.test.mjs tests/pdf-organizer-task4.test.mjs tests/pdf-organizer-task5.test.mjs tests/pdf-organizer-removal-regression.test.mjs tests/pdf-organizer-postaudit.test.mjs

  organizer-browser:
    name: Chromium Firefox WebKit integration / mobile viewport
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated QA-only browser dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.10.3
      - name: Install supported test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start local nonproduction static host
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pdf-organizer-http.log 2>&1 &
          for i in $(seq 1 25); do
            curl --fail --silent http://127.0.0.1:8765/documents/pdf-organizer/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/pdf-organizer-http.log
          exit 1
      - name: Exercise actual tool UI and generated PDFs
        env:
          PDF_ORGANIZER_BASE_URL: http://127.0.0.1:8765/
        run: node tests/pdf-organizer-task5.browser.mjs
