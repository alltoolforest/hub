name: Application Document Prep Task 1 checks
on:
  pull_request:
    paths:
      - 'assets/js/application-prep.js'
      - 'assets/js/application-prep-checks.js'
      - 'assets/js/images.js'
      - 'tests/application-prep-task1.test.mjs'
      - 'tests/application-prep-task1-integrity*.mjs'
      - '.github/workflows/application-prep-task1.yml'
  workflow_dispatch:
jobs:
  task1-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check isolated source and shared image router
        run: |
          node --check assets/js/application-prep.js
          node --check assets/js/application-prep-checks.js
          node --check assets/js/images.js
      - name: Run Application Document Prep Task 1 regression
        run: node --test tests/application-prep-task1.test.mjs tests/application-prep-task1-integrity.test.mjs
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Task 1 real-browser regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/application-prep-task1-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/application-document-prep/ >/dev/null && break || sleep 1; done
          node tests/application-prep-task1-integrity-browser.mjs
