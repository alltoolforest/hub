name: Image Enhancer one-time RAW runtime vendor

on:
  push:
    branches:
      - image-enhancer-detail-adaptive-raw

permissions:
  contents: write

jobs:
  vendor:
    if: "!contains(github.event.head_commit.message, 'Vendor pinned RAW runtime')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: image-enhancer-detail-adaptive-raw

      - name: Install pinned RAW runtime
        run: npm install --no-save --no-package-lock rawconvert-wasm@0.1.1

      - name: Copy pinned browser runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/vendor/rawconvert
          cp node_modules/rawconvert-wasm/dist/index.js assets/vendor/rawconvert/index.js
          cp node_modules/rawconvert-wasm/dist/rawconvert-core.js assets/vendor/rawconvert/rawconvert-core.js
          cp node_modules/rawconvert-wasm/dist/rawconvert-core.wasm assets/vendor/rawconvert/rawconvert-core.wasm
          if [ -f node_modules/rawconvert-wasm/LICENSE ]; then
            cp node_modules/rawconvert-wasm/LICENSE assets/vendor/rawconvert/LICENSE
          elif [ -f node_modules/rawconvert-wasm/LICENSE.md ]; then
            cp node_modules/rawconvert-wasm/LICENSE.md assets/vendor/rawconvert/LICENSE.md
          fi

      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alltoolforest"
          git config user.email "thesaleforest@gmail.com"
          git add assets/vendor/rawconvert
          if git diff --cached --quiet; then
            echo "Pinned RAW runtime already present."
            exit 0
          fi
          git commit -m "Enhancer: Vendor pinned RAW runtime 0.1.1"
          git push origin HEAD:image-enhancer-detail-adaptive-raw
