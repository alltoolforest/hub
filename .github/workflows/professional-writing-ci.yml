name: Professional Writing Assistant CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'work/writing/**'
      - 'assets/js/writing-v2/**'
      - 'assets/css/writing-v2-task2.css'
      - 'assets/css/writing-v2-task3.css'
      - '.github/workflows/professional-writing-ci.yml'
  push:
    branches: [main]
    paths:
      - 'work/writing/**'
      - 'assets/js/writing-v2/**'
      - 'assets/css/writing-v2-task2.css'
      - 'assets/css/writing-v2-task3.css'
      - '.github/workflows/professional-writing-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-writing-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Task 4 scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE"...HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -Ev '^(work/writing/|assets/js/writing-v2/|assets/css/writing-v2-task2\.css$|assets/css/writing-v2-task3\.css$|\.github/workflows/professional-writing-ci\.yml$)' /tmp/changed.txt | grep -q .; then
            echo "Unexpected file outside Professional Writing Assistant scope."
            exit 1
          fi

      - name: JavaScript syntax checks
        run: |
          node --check assets/js/writing-v2/contracts.js
          node --check assets/js/writing-v2/engine.js
          node --check assets/js/writing-v2/task2-state.js
          node --check assets/js/writing-v2/task2-storage.js
          node --check assets/js/writing-v2/task2-builder.js
          node --check assets/js/writing-v2/task3-bootstrap.js
          node --check assets/js/writing-v2/task4-regression.js

      - name: Run Writing Assistant regression
        run: |
          node assets/js/writing-v2/task1-regression.js
          node assets/js/writing-v2/task2-regression.js
          node assets/js/writing-v2/task3-regression.js
          node assets/js/writing-v2/task4-regression.js

      - name: Verify published GitHub Pages artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://alltoolforest.github.io/hub/work/writing/'
          CSS2='https://alltoolforest.github.io/hub/assets/css/writing-v2-task2.css'
          CSS3='https://alltoolforest.github.io/hub/assets/css/writing-v2-task3.css'
          BOOT='https://alltoolforest.github.io/hub/assets/js/writing-v2/task3-bootstrap.js'
          ok=0
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$PAGE" -o /tmp/writing.html               && grep -q 'id="writing-v2-workspace"' /tmp/writing.html               && grep -q 'writing-v2/task3-bootstrap.js' /tmp/writing.html               && grep -q 'Private by design' /tmp/writing.html               && ! grep -q 'assets/js/app.js' /tmp/writing.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          curl -fsSI --max-time 20 "$CSS2" | head -n 1 | grep -q '200'
          curl -fsSI --max-time 20 "$CSS3" | head -n 1 | grep -q '200'
          curl -fsSI --max-time 20 "$BOOT" | head -n 1 | grep -q '200'
          echo "Published Professional Writing Assistant V2 verified."
