name: Image to Text OCR Task 1 reliability
on:
  pull_request:
    paths:
      - 'assets/js/image-to-text-ocr.js'
      - 'assets/js/image-ocr-reliability.js'
      - 'assets/js/pdf.js'
      - 'tests/image-ocr-task1.test.mjs'
      - '.github/workflows/image-ocr-task1.yml'
  workflow_dispatch:
jobs:
  image-ocr-reliability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check OCR module and PDF router syntax
        run: |
          node --check assets/js/image-to-text-ocr.js
          node --check assets/js/image-ocr-reliability.js
          node --check assets/js/pdf.js
      - name: Run Task 1 regressions
        run: node --test tests/image-ocr-task1.test.mjs
