name: PDF Merger bookmark opt-in regression
on:
  pull_request:
    paths:
      - 'assets/js/pdf-merger*.js'
      - 'assets/css/pdf-merger.css'
      - 'tests/pdf-merger-bookmarks*.mjs'
      - '.github/workflows/pdf-merger-bookmarks.yml'
  workflow_dispatch:
jobs:
  bookmark-safety-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, bookmark consent, and original PDF Merger verification
        run: |
          node --check assets/js/pdf-merger-verify.js
          node --check assets/js/pdf-merger-runner.js
          node --check assets/js/pdf-merger-worker.js
          node --check assets/js/pdf-merger.js
          node --test tests/pdf-merger-bookmarks.test.mjs tests/pdf-merger-task1.test.mjs tests/pdf-merger-task2.test.mjs tests/pdf-merger-postdeploy.test.mjs tests/pdf-merger-mobile20.test.mjs
      - name: Install cross-browser engine
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify opt-in end-to-end and existing page merging
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pdf-merger-bookmarks.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/pdf-merger/ >/dev/null && break || sleep 1; done
          node tests/pdf-merger-bookmarks-browser.mjs
          node tests/pdf-merger-task2-browser.mjs
          node tests/pdf-merger-mobile20-browser.mjs
