name: Image to Text OCR Task 2 checks
on:
  pull_request:
    paths:
      - 'assets/js/image-to-text-ocr.js'
      - 'assets/js/image-ocr-prep.js'
      - 'assets/js/image-ocr-reliability.js'
      - 'assets/css/image-to-text-ocr.css'
      - 'documents/image-to-text/index.html'
      - 'tests/image-ocr-task*.mjs'
      - '.github/workflows/image-ocr-task2.yml'
  workflow_dispatch:
jobs:
  image-ocr-task2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check OCR modules
        run: |
          node --check assets/js/image-to-text-ocr.js
          node --check assets/js/image-ocr-reliability.js
          node --check assets/js/image-ocr-prep.js
          node --check tests/image-ocr-task2-browser.mjs
      - name: Run Tasks 1 and 2 unit regressions
        run: node --test tests/image-ocr-task1.test.mjs tests/image-ocr-task2.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run both browser workflows with mocked OCR engine
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/image-ocr-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/image-to-text/ >/dev/null && break || sleep 1; done
          node tests/image-ocr-task1-browser.mjs
          node tests/image-ocr-task2-browser.mjs
