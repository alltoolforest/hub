name: PDF Compressor Task 3 isolated image inventory
on:
  push:
    branches:
      - pdf-compressor-task3-image-research-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task3-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Task 3 image inventory probe
        run: node --test tests/pdf-compressor-task3-image-inventory.test.mjs
      - name: Task 3 eligibility policy tests
        run: node --test tests/pdf-compressor-task3-policy.test.mjs
      - name: Task 1 regression
        run: node --test tests/pdf-compressor-task1-baseline.test.mjs
