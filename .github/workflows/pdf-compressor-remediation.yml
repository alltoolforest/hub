name: PDF Compressor isolated remediation regression
on:
  push:
    branches:
      - pdf-compressor-remediation-t6-t13-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Policy and state tests
        run: node --test tests/pdf-compressor-remediation-policy.test.mjs
      - name: Task 1, 3, 4, 5 regression checks
        run: node --test tests/pdf-compressor-task1-baseline.test.mjs tests/pdf-compressor-task3-policy.test.mjs tests/pdf-compressor-task4-lossless.test.mjs tests/pdf-compressor-task5-image-candidate.test.mjs
