name: Organize PDF V2 live-route checks
on:
  pull_request:
    paths:
      - 'documents/pdf-organizer/**'
      - '.github/workflows/pdf-organizer-v2-live.yml'
  push:
    branches: [main]
    paths:
      - 'documents/pdf-organizer/**'
      - '.github/workflows/pdf-organizer-v2-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  organizer-live-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/pdf-organizer*.test.mjs documents/pdf-organizer/engine.test.mjs documents/pdf-organizer/complex-corpus.test.mjs documents/pdf-organizer/stress-integrity.test.mjs documents/pdf-organizer/size-capacity.test.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.14.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node documents/pdf-organizer/browser.test.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          ORGANIZER_AXE_PATH: node_modules/axe-core/axe.min.js
      - run: node documents/pdf-organizer/browser-stress.test.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Verify 100 MB PDF in desktop/mobile browser
        run: node documents/pdf-organizer/browser-100mb.test.mjs
        env:
          BROWSER: ${{ matrix.browser }}
