name: Application Prep Task 5 security SEO release gate
on:
  pull_request:
    paths:
      - 'documents/application-document-prep/index.html'
      - 'assets/js/application-prep*.js'
      - 'tests/application-prep-task5*.mjs'
      - '.github/workflows/application-prep-task5-release.yml'
  workflow_dispatch:
jobs:
  task5-release-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and all prior task unit regressions
        run: |
          node --check assets/js/application-prep.js
          node --check tests/application-prep-task5-security-browser.mjs
          node --check tests/application-prep-task5-release-check.mjs
          node --test tests/application-prep-task1.test.mjs tests/application-prep-task1-integrity.test.mjs tests/application-prep-task2.test.mjs tests/application-prep-task3-resources.test.mjs tests/application-prep-task5-release.test.mjs
      - name: Staging security privacy SEO release gate
        run: node tests/application-prep-task5-release-check.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser checks for file confidentiality and CSP
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/application-prep-task5-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/application-document-prep/ >/dev/null && break || sleep 1; done
          node tests/application-prep-task5-security-browser.mjs
      - name: Full prior browser regression under the Task 5 CSP
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$BROWSER" = "chromium" ]; then node tests/application-prep-task1-integrity-browser.mjs; fi
          node tests/application-prep-task2-fidelity-browser.mjs
          node tests/application-prep-task3-browser.mjs
          node tests/application-prep-task4-accessibility-browser.mjs
