name: Image Enhancer pre-deployment audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/app.js'
      - 'assets/js/image-enhancer.js'
      - 'assets/js/image-enhancer-photo*.js'
      - 'assets/js/image-enhancer-portrait.js'
      - 'tests/image-enhancer-photo*.mjs'
      - 'tests/image-enhancer-reference-quality*.mjs'
      - 'assets/js/image-enhancer-budget.js'
      - 'tests/image-enhancer-budget.test.mjs'
      - 'assets/js/image-enhancer-deblur-validation.js'
      - 'tests/image-enhancer-deblur-trial/validation.test.mjs'
      - 'assets/js/image-enhancer-bootstrap.js'
      - 'assets/js/image-enhancer-capabilities.js'
      - 'assets/js/image-enhancer-artifact-guard.js'
      - 'assets/js/image-enhancer-export.js'
      - 'assets/js/image-enhancer-face-safety.js'
      - 'assets/js/image-enhancer-inspector.js'
      - 'assets/js/image-enhancer-output.js'
      - 'assets/js/image-enhancer-region-restoration.js'
      - 'assets/js/image-enhancer-processing-worker.js'
      - 'assets/js/image-enhancer-restoration.js'
      - 'assets/js/image-enhancer-routing.js'
      - 'assets/js/image-enhancer-tiles.js'
      - 'assets/models/image-enhancer/**'
      - 'docs/image-enhancer-model-benchmark.md'
      - 'tests/image-enhancer-browser.mjs'
      - 'tests/image-enhancer-modes-browser.mjs'
      - 'tests/image-enhancer-fusion.test.mjs'
      - 'tests/image-enhancer-fusion-browser.mjs'
      - 'tests/image-enhancer-artifact-guard-browser.mjs'
      - 'tests/image-enhancer-output-browser.mjs'
      - 'tests/image-enhancer-inspector-browser.mjs'
      - 'tests/image-enhancer-export-browser.mjs'
      - 'tests/image-enhancer-compatibility-browser.mjs'
      - 'tests/image-enhancer-resilience-browser.mjs'
      - 'tests/image-enhancer-responsiveness-browser.mjs'
      - 'tests/image-enhancer-deblur-browser.mjs'
      - 'tests/image-enhancer-diagnosis-browser.mjs'
      - 'tests/image-enhancer-face-safety-browser.mjs'
      - 'tests/image-enhancer-region-restoration-browser.mjs'
      - 'tests/image-enhancer-realworld-benchmark.mjs'
      - 'tests/fixtures/nafnet-natural-sharp.png'
      - 'tests/image-enhancer-deblur-cross-browser.mjs'
      - 'tests/image-enhancer-cross-browser.mjs'
      - '_headers'
      - '.github/workflows/image-enhancer-ci.yml'
  workflow_dispatch:

concurrency:
  group: image-enhancer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enhancer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Shared images.js includes the already-merged 4c1a7d75 application-prep routing; unchanged by this PR.
      - name: Protect frozen files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/js/images.js)" = "66083abc7fc8cd6ef2a42e90b85d40ce3c923759"
          test "$(git hash-object assets/js/batch-image-processor.js)" = "56886c29575ceca209aa057bf0f6078c212a837d"
          test "$(git hash-object assets/js/background-remover.js)" = "041046003d0e6cbf0985c248fea57465e57fee8b"
          test "$(git hash-object assets/js/image-studio.js)" = "cb569aa47ebc18c0b4649a99a270c999678922f8"
          test "$(git hash-object assets/js/calculators.js)" = "99632e840cf9f77269724f2af81daff225231c39"
          echo 'Frozen/shared file SHAs verified.'

      # Compressor hash tracks its approved d8b3c0f release; its source is untouched.
      - name: Static enhancer checks
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/image-enhancer.js
          node --check assets/js/image-enhancer-photo.js
          node --check assets/js/image-enhancer-photo-worker.js
          node --check assets/js/image-enhancer-photo-engine.js
          node --test tests/image-enhancer-budget.test.mjs
          node --test tests/image-enhancer-deblur-trial/validation.test.mjs
          node --check assets/js/image-enhancer-artifact-guard.js
          node --check assets/js/image-enhancer-bootstrap.js
          node --check assets/js/image-enhancer-capabilities.js
          node --check assets/js/image-enhancer-export.js
          node --check assets/js/image-enhancer-face-safety.js
          node --check assets/js/image-enhancer-inspector.js
          node --check assets/js/image-enhancer-output.js
          node --check assets/js/image-enhancer-region-restoration.js
          node --check assets/js/image-enhancer-processing-worker.js
          node --check assets/js/image-enhancer-restoration.js
          node --check assets/js/image-enhancer-routing.js
          node --check assets/js/image-enhancer-tiles.js
          node --check assets/js/app.js
          node --check tests/image-enhancer-compatibility-browser.mjs
          node --check tests/image-enhancer-artifact-guard-browser.mjs
          node --check tests/image-enhancer-resilience-browser.mjs
          node --check tests/image-enhancer-responsiveness-browser.mjs
          node --check tests/image-enhancer-deblur-browser.mjs
          node --check tests/image-enhancer-diagnosis-browser.mjs
          node --check tests/image-enhancer-face-safety-browser.mjs
          node --check tests/image-enhancer-region-restoration-browser.mjs
          node --check tests/image-enhancer-realworld-benchmark.mjs
          node --check tests/image-enhancer-deblur-cross-browser.mjs
          node --check tests/image-enhancer-cross-browser.mjs
          node -e "const m=require('./assets/models/image-enhancer/manifest.json'); if(m.runtime.version!=='1.30.0'||!m.runtime.wasmModule||!m.runtime.wasmBinary||m.models['general-x4'].sha256!=='09b757accd747d7e423c1d352b3e8f23e77cc5742d04bae958d4eb8082b76fa4'||m.models['deblur-nafnet'].sha256!=='05b455663115b19de4577d7d092bcd52f34b51517a83c1679cf28a31f4078204'||m.models['face-safety-ultraface'].sha256!=='34cd7e60aeff28744c657de7a3dc64e872d506741de66987f3426f2b79f88017') process.exit(1);"
          grep -q "slug==='enhance'.*image-enhancer-bootstrap.js" assets/js/app.js
          grep -q "'text-logo': Object.freeze" assets/js/image-enhancer-routing.js
          grep -q "engine: 'standard'" assets/js/image-enhancer-routing.js
          grep -q "Memory pressure detected" assets/js/image-enhancer.js
          grep -q "likelyBlurred" assets/js/image-enhancer-restoration.js
          grep -q "buildDegradationDiagnosis" assets/js/image-enhancer-restoration.js
          grep -q "underexposure" assets/js/image-enhancer-restoration.js
          grep -q "overexposure" assets/js/image-enhancer-restoration.js
          grep -q "FaceIdentitySafetyEngine" assets/js/image-enhancer.js
          grep -q "applyArtifactFidelityGuard" assets/js/image-enhancer.js
          grep -q "analyzeArtifactFidelity" assets/js/image-enhancer-artifact-guard.js
          grep -q "applyFaceIdentityGuard" assets/js/image-enhancer.js
          grep -q "faceSafetyAiLimitAt" assets/js/image-enhancer-processing-worker.js
          grep -q "resolveRegionRestorationPlan" assets/js/image-enhancer-region-restoration.js
          grep -q "region-aware-restore" assets/js/image-enhancer-processing-worker.js
          grep -q "OnnxDeblurEngine" assets/js/image-enhancer.js
          grep -q "dedicated deblur AI" assets/js/image-enhancer.js
          grep -q "env.wasm.proxy" assets/js/image-enhancer.js
          grep -q "image-enhancer-processing-worker.js" assets/js/image-enhancer.js
          ! grep -q "executionProviders: \['webgpu'\]" assets/js/image-enhancer.js
          grep -q "aiInferenceDimensions" assets/js/image-enhancer.js
          grep -q "mountOutputPlanner" assets/js/image-enhancer-bootstrap.js
          grep -q "enhancerPlannerCaps" assets/js/image-enhancer-bootstrap.js
          grep -q "detectEnhancerCapabilities" assets/js/image-enhancer.js
          ! grep -q "maxPixels: 8e6" assets/js/image-enhancer-bootstrap.js
          ! grep -q "8e6" assets/js/image-enhancer-output.js
          grep -q "mountInspector" assets/js/image-enhancer-bootstrap.js
          grep -q "mountExportControls" assets/js/image-enhancer-bootstrap.js
          grep -q "resolveOutputTarget" assets/js/image-enhancer-output.js
          grep -q "enhancer-compare-viewport" assets/js/image-enhancer-inspector.js
          grep -q "enhancer-export-format" assets/js/image-enhancer-export.js
          grep -q "JPG cannot store transparency" assets/js/image-enhancer-export.js
          echo 'Enhancer routing, syntax, restoration, content routing, memory-aware tiling, output planning, inspection workspace, export matrix, compatibility and resilience audits, runtime pin and model checksum pin verified.'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Verify hosted Chrome
        run: google-chrome --version

      - name: Check independent photographic engine
        run: node --test tests/image-enhancer-photo.test.mjs tests/image-enhancer-photo-lifecycle.test.mjs tests/image-enhancer-reference-quality.test.mjs

      - name: Run CSP + real AI browser smoke test
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-browser.mjs

      - name: Run three-mode strict deblur audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-modes-browser.mjs

      - name: Run single-pass face fusion audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node --test tests/image-enhancer-fusion.test.mjs
          node tests/image-enhancer-fusion-browser.mjs

      - name: Run artifact/fidelity guard audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-artifact-guard-browser.mjs

      - name: Run dedicated deblur ground-truth audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-deblur-browser.mjs

      - name: Run degradation diagnosis audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-diagnosis-browser.mjs

      - name: Run face identity safety audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-face-safety-browser.mjs

      - name: Run region-aware restoration audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-region-restoration-browser.mjs

      - name: Run Task 5 real-world benchmark
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-realworld-benchmark.mjs

      - name: Run realistic desktop responsiveness audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-responsiveness-browser.mjs

      - name: Run output planner browser audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-output-browser.mjs

      - name: Run inspection workspace browser audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-inspector-browser.mjs

      - name: Run export format browser audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-export-browser.mjs

      - name: Run input and mobile compatibility audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-compatibility-browser.mjs

      - name: Run deep resilience browser audit
        if: ${{ !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/image-enhancer-resilience-browser.mjs

  engine-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Run Firefox + WebKit real-WASM audit
        if: ${{ !cancelled() }}
        run: node tests/image-enhancer-cross-browser.mjs

      - name: Run Firefox + WebKit dedicated deblur audit
        if: ${{ !cancelled() }}
        run: node tests/image-enhancer-deblur-cross-browser.mjs
