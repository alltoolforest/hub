name: Application Prep Task 4 guided workflow accessibility
on:
  pull_request:
    paths:
      - 'assets/js/application-prep.js'
      - 'assets/css/application-prep.css'
      - 'tests/application-prep-task4-accessibility-browser.mjs'
      - '.github/workflows/application-prep-task4-accessibility.yml'
  workflow_dispatch:
jobs:
  guided-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and existing Task 1–3 unit regressions
        run: |
          node --check assets/js/application-prep.js
          node --check tests/application-prep-task4-accessibility-browser.mjs
          node --test tests/application-prep-task1.test.mjs tests/application-prep-task1-integrity.test.mjs tests/application-prep-task2.test.mjs tests/application-prep-task3-resources.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tool-scoped interactive accessibility regression
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/app-prep-task4-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/documents/application-document-prep/ >/dev/null && break || sleep 1; done
          node tests/application-prep-task4-accessibility-browser.mjs
