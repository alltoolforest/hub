<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate exact age, date differences and total days between dates."><title>Age & Date Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:900px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Dates</div><h1>Age & Date Calculator</h1><div class="grid"><div class="field"><label>Start / birth date<input id="a" type="date"></label></div><div class="field"><label>End date<input id="b" type="date"></label></div></div><button class="primary" id="go">Calculate difference</button><div class="result" id="out"></div><div class="note">Date-only values are treated as calendar dates. Exact age is shown as completed years, months and days.</div></div></div></main><script>const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());function parse(v){const m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null}const now=new Date();$('b').value=fmt(new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())));function c(){let s=parse($('a').value),e=parse($('b').value);if(!s||!e||s>e){$('out').textContent='Choose a valid start date on or before the end date.';return}const days=Math.round((e-s)/86400000);let y=e.getUTCFullYear()-s.getUTCFullYear(),m=e.getUTCMonth()-s.getUTCMonth(),d=e.getUTCDate()-s.getUTCDate();if(d<0){m--;const prev=new Date(Date.UTC(e.getUTCFullYear(),e.getUTCMonth(),0));d+=prev.getUTCDate()}if(m<0){y--;m+=12}$('out').innerHTML='<strong>'+y+' years, '+m+' months, '+d+' days</strong><br>Total days between dates: '+days.toLocaleString()}$('go').onclick=c</script></body></html>
