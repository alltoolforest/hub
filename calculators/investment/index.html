<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIP & Investment Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Investing</div><h1>SIP & Investment Calculator</h1><div class="grid"><div class="field"><label>Mode<select id="mode"><option value="sip">Monthly SIP</option><option value="lump">Lumpsum</option><option value="step">Step-up SIP</option></select></label></div><div class="field"><label id="amtLabel">Monthly investment<input id="amt" type="number" min="0" value="5000"></label></div><div class="field"><label>Expected annual return %<input id="rate" type="number" step=".01" value="12"></label></div><div class="field"><label>Years<input id="years" type="number" min="1" max="100" value="10"></label></div><div class="field" id="stepBox" style="display:none"><label>Annual SIP increase %<input id="step" type="number" min="0" value="10"></label></div></div><button class="primary" id="go">Calculate</button><div class="result" id="out"></div><div class="note">Illustration only. Market returns are not guaranteed; taxes, fees and inflation are not included.</div></div></div></main><script>const $=x=>document.getElementById(x);function c(){const mode=$('mode').value,a=+$('amt').value,R=+$('rate').value/100,y=Math.round(+$('years').value),st=+$('step').value/100;if(a<0||y<1||y>100||st<0){$('out').textContent='Check the inputs.';return}const mr=Math.pow(1+R,1/12)-1;let value=0,paid=0;if(mode==='lump'){value=a*Math.pow(1+R,y);paid=a}else{let monthly=a;for(let m=0;m<y*12;m++){value=value*(1+mr)+monthly;paid+=monthly;if(mode==='step'&&(m+1)%12===0)monthly*=1+st}}$('out').innerHTML='<strong>'+value.toLocaleString(undefined,{maximumFractionDigits:2})+'</strong><br>Amount invested: '+paid.toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Estimated growth: '+(value-paid).toLocaleString(undefined,{maximumFractionDigits:2})}function mode(){const m=$('mode').value;$('amtLabel').childNodes[0].nodeValue=m==='lump'?'Lumpsum amount':'Monthly investment';$('stepBox').style.display=m==='step'?'block':'none';c()}$('mode').onchange=mode;$('go').onclick=c;c()</script></body></html>
