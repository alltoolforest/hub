<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Estimate fixed loan or EMI payments, total repayment and total interest."><title>Loan & EMI Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:900px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Loans</div><h1>Loan & EMI Calculator</h1><div class="grid"><div class="field"><label>Loan amount<input id="p" type="number" min="0" value="500000"></label></div><div class="field"><label>Annual interest %<input id="rate" type="number" min="0" step=".01" value="9"></label></div><div class="field"><label>Term (years)<input id="years" type="number" min=".1" step=".1" value="5"></label></div></div><button class="primary" id="go">Calculate</button><div class="result" id="out" aria-live="polite"></div><div class="note">Uses the standard fixed-payment amortizing-loan formula. Fees, taxes, insurance and changing rates are not included.</div></div></div></main><script>const $=x=>document.getElementById(x);function calc(){const p=+$('p').value,r=+$('rate').value/1200,n=Math.round(+$('years').value*12);if(!(p>=0)||n<1){$('out').textContent='Enter a valid amount and term.';return}const emi=r?p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):p/n,total=emi*n;$('out').innerHTML='<strong>'+emi.toLocaleString(undefined,{maximumFractionDigits:2})+' / month</strong><br>Total repayment: '+total.toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Total interest: '+(total-p).toLocaleString(undefined,{maximumFractionDigits:2})}$('go').onclick=calc;calc()</script></body></html>
