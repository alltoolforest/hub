<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate percentages, percentage change, discounts, sale prices, tips and totals."><title>Percentage Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:900px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Everyday math</div><h1>Percentage Calculator</h1><div class="grid"><div class="field"><label>Calculation<select id="mode"><option value="of">What is X% of Y?</option><option value="what">X is what % of Y?</option><option value="change">Percentage change</option><option value="discount">Discount / sale price</option><option value="tip">Tip & total</option></select></label></div><div class="field"><label id="la">X<input id="a" type="number" step="any" value="15"></label></div><div class="field"><label id="lb">Y<input id="b" type="number" step="any" value="100"></label></div></div><button class="primary" id="go">Calculate</button><div class="result" id="out" aria-live="polite"></div><div class="note">Percentage change uses (new − old) ÷ old × 100. A zero denominator is not valid.</div></div></div></main><script>const $=x=>document.getElementById(x);function calc(){const m=$('mode').value,a=+$('a').value,b=+$('b').value;let r;if(m==='of')r=(a/100)*b;if(m==='what')r=b===0?null:a/b*100;if(m==='change')r=a===0?null:(b-a)/a*100;if(m==='discount')r=b*(1-a/100);if(m==='tip')r=b*(1+a/100);$('out').innerHTML=r===null||!Number.isFinite(r)?'Enter values with a non-zero denominator.':'<strong>'+r.toLocaleString(undefined,{maximumFractionDigits:4})+(m==='what'||m==='change'?'%':'')+'</strong>'}$('go').onclick=calc;$('mode').onchange=calc;calc()</script></body></html>
