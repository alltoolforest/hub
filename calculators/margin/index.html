<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profit Margin & Markup Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:920px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Business pricing</div><h1>Profit Margin & Markup Calculator</h1><div class="grid"><div class="field"><label>Cost<input id="cost" type="number" min="0" step=".01" value="60"></label></div><div class="field"><label>Selling price<input id="price" type="number" min="0" step=".01" value="100"></label></div></div><button class="primary" id="go">Calculate</button><div class="result" id="out"></div><div class="note">Margin = profit ÷ selling price. Markup = profit ÷ cost. They are not the same percentage.</div></div></div></main><script>const $=x=>document.getElementById(x);function c(){const cost=+$('cost').value,p=+$('price').value;if(cost<0||p<0){$('out').textContent='Check the inputs.';return}const profit=p-cost,margin=p?profit/p*100:null,markup=cost?profit/cost*100:null;$('out').innerHTML='<strong>Profit: '+profit.toLocaleString(undefined,{maximumFractionDigits:2})+'</strong><br>Margin: '+(margin===null?'—':margin.toFixed(2)+'%')+'<br>Markup: '+(markup===null?'—':markup.toFixed(2)+'%')} $('go').onclick=c;c()</script></body></html>
