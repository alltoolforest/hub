<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert length, weight, temperature, area, volume and digital data units."><title>Unit Converter — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:900px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Conversion</div><h1>Unit Converter</h1><div class="grid"><div class="field"><label>Category<select id="cat"><option>Length</option><option>Weight</option><option>Temperature</option><option>Area</option><option>Volume</option><option>Data</option></select></label></div><div class="field"><label>Value<input id="v" type="number" step="any" value="1"></label></div><div class="field"><label>From<select id="from"></select></label></div><div class="field"><label>To<select id="to"></select></label></div></div><div class="result" id="out"></div></div></div></main><script>const $=x=>document.getElementById(x),U={Length:{m:1,km:1000,cm:.01,mm:.001,in:.0254,ft:.3048,yd:.9144,mi:1609.344},Weight:{kg:1,g:.001,mg:.000001,lb:.45359237,oz:.028349523125},Area:{m2:1,km2:1e6,ft2:.09290304,acre:4046.8564224,ha:10000},Volume:{L:1,mL:.001,'m3':1000,'US gal':3.785411784,'US fl oz':.0295735295625},Data:{B:1,KB:1000,MB:1e6,GB:1e9,TB:1e12,KiB:1024,MiB:1048576,GiB:1073741824}};function setup(){const c=$('cat').value,arr=c==='Temperature'?['°C','°F','K']:Object.keys(U[c]);$('from').innerHTML=$('to').innerHTML=arr.map(x=>'<option>'+x+'</option>').join('');$('to').selectedIndex=1;calc()}function calc(){const c=$('cat').value,v=+$('v').value,f=$('from').value,t=$('to').value;let r;if(c==='Temperature'){let k=f==='°C'?v+273.15:f==='°F'?(v-32)*5/9+273.15:v;r=t==='°C'?k-273.15:t==='°F'?(k-273.15)*9/5+32:k}else r=v*U[c][f]/U[c][t];$('out').innerHTML='<strong>'+r.toLocaleString(undefined,{maximumFractionDigits:8})+' '+t+'</strong>'}$('cat').onchange=setup;['v','from','to'].forEach(x=>$(x).oninput=calc);setup()</script></body></html>
