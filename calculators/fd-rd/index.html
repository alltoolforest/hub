<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Estimate fixed deposit and recurring deposit maturity values and interest."><title>FD RD Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Deposits</div><h1>FD / RD Calculator</h1><div class="grid"><div class="field"><label>Deposit type<select id="mode"><option value="fd">Fixed Deposit (FD)</option><option value="rd">Recurring Deposit (RD)</option></select></label></div><div class="field"><label id="amtLabel">Principal<input id="amt" type="number" min="0" value="100000"></label></div><div class="field"><label>Annual interest %<input id="rate" type="number" min="0" step=".01" value="7"></label></div><div class="field"><label>Term (months)<input id="months" type="number" min="1" max="1200" value="36"></label></div><div class="field"><label>Compounding<select id="n"><option value="4">Quarterly</option><option value="12">Monthly</option><option value="2">Half-yearly</option><option value="1">Annually</option></select></label></div></div><button class="primary" id="go">Calculate maturity</button><div class="result" id="out"></div><div class="note">Estimate only. Banks may use different deposit dates, compounding conventions, rounding, penalties and tax treatment. Confirm actual maturity with the institution.</div></div></div></main><script>const $=x=>document.getElementById(x);function c(){const mode=$('mode').value,a=+$('amt').value,R=+$('rate').value/100,m=Math.round(+$('months').value),n=+$('n').value;if(a<0||m<1){$('out').textContent='Check the inputs.';return}let value,paid;if(mode==='fd'){value=a*Math.pow(1+R/n,n*m/12);paid=a}else{const mr=Math.pow(1+R/n,n/12)-1;value=0;paid=a*m;for(let i=0;i<m;i++)value=value*(1+mr)+a}$('out').innerHTML='<strong>'+value.toLocaleString(undefined,{maximumFractionDigits:2})+'</strong><br>Total deposited: '+paid.toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Estimated interest: '+(value-paid).toLocaleString(undefined,{maximumFractionDigits:2})}function mode(){ $('amtLabel').childNodes[0].nodeValue=$('mode').value==='fd'?'Principal':'Monthly deposit';c()}$('mode').onchange=mode;$('go').onclick=c;c()</script></body></html>
