<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Estimate annual, monthly, weekly and hourly take-home pay from user-entered deductions."><title>Salary & Take-home Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:900px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Income</div><h1>Salary & Take-home Calculator</h1><div class="grid"><div class="field"><label>Gross annual salary<input id="gross" type="number" min="0" value="60000"></label></div><div class="field"><label>Tax / withholding %<input id="tax" type="number" min="0" max="100" step=".1" value="20"></label></div><div class="field"><label>Other annual deductions<input id="ded" type="number" min="0" value="0"></label></div></div><button class="primary" id="go">Calculate</button><div class="result" id="out"></div><div class="note">Global estimate: you provide the deduction rate. It does not calculate any country's tax law, benefits, pension, social insurance or payroll rules.</div></div></div></main><script>const $=x=>document.getElementById(x);function c(){const g=+$('gross').value,t=+$('tax').value,d=+$('ded').value;if(g<0||t<0||t>100||d<0){$('out').textContent='Check the inputs.';return}const net=Math.max(0,g*(1-t/100)-d);$('out').innerHTML='<strong>'+ (net/12).toLocaleString(undefined,{maximumFractionDigits:2})+' / month</strong><br>Annual take-home: '+net.toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Weekly: '+(net/52).toLocaleString(undefined,{maximumFractionDigits:2})+' · Hourly (40h/week): '+(net/2080).toLocaleString(undefined,{maximumFractionDigits:2})}$('go').onclick=c;c()</script></body></html>
