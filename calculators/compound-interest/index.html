<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Estimate compound growth from a starting balance and recurring contributions."><title>Compound Interest Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:900px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Savings</div><h1>Savings & Compound Interest</h1><div class="grid"><div class="field"><label>Starting amount<input id="p" type="number" min="0" value="10000"></label></div><div class="field"><label>Annual return %<input id="r" type="number" step=".01" value="6"></label></div><div class="field"><label>Years<input id="y" type="number" min="0" value="10"></label></div><div class="field"><label>Monthly contribution<input id="c" type="number" min="0" value="200"></label></div><div class="field"><label>Compounding<select id="n"><option value="12">Monthly</option><option value="4">Quarterly</option><option value="1">Annually</option><option value="365">Daily</option></select></label></div></div><button class="primary" id="go">Calculate growth</button><div class="result" id="out"></div><div class="note">Illustrative estimate only. Investment returns are not guaranteed. Monthly contributions are modeled monthly.</div></div></div></main><script>const $=x=>document.getElementById(x);function calc(){const p=+$('p').value,R=+$('r').value/100,y=+$('y').value,n=+$('n').value,c=+$('c').value;if(y<0||p<0||c<0){$('out').textContent='Enter non-negative amounts and time.';return}const principal=p*Math.pow(1+R/n,n*y),mr=R/12,months=Math.round(y*12),adds=mr?c*(Math.pow(1+mr,months)-1)/mr:c*months,end=principal+adds,contrib=p+c*months;$('out').innerHTML='<strong>'+end.toLocaleString(undefined,{maximumFractionDigits:2})+'</strong><br>Total contributed: '+contrib.toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Estimated growth: '+(end-contrib).toLocaleString(undefined,{maximumFractionDigits:2})}$('go').onclick=calc;calc()</script></body></html>
