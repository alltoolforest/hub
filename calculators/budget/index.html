<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Planner — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Personal finance</div><h1>Monthly Budget Planner</h1><div class="grid"><div class="field"><label>Take-home income<input id="income" type="number" min="0" value="50000"></label></div><div class="field"><label>Housing<input class="e" type="number" min="0" value="15000"></label></div><div class="field"><label>Food<input class="e" type="number" min="0" value="7000"></label></div><div class="field"><label>Transport<input class="e" type="number" min="0" value="4000"></label></div><div class="field"><label>EMIs / debt<input class="e" type="number" min="0" value="5000"></label></div><div class="field"><label>Utilities & bills<input class="e" type="number" min="0" value="3000"></label></div><div class="field"><label>Insurance / health<input class="e" type="number" min="0" value="2000"></label></div><div class="field"><label>Entertainment / wants<input class="e" type="number" min="0" value="3000"></label></div><div class="field"><label>Other spending<input class="e" type="number" min="0" value="1000"></label></div></div><button class="primary" id="go">Review budget</button><div class="result" id="out"></div><div class="note">The 50/30/20 figures are an optional comparison, not a rule: 50% needs, 30% wants, 20% savings/debt goals. Your appropriate budget can differ.</div></div></div></main><script>const $=x=>document.getElementById(x);function c(){const inc=+$('income').value,vals=[...document.querySelectorAll('.e')].map(x=>+x.value||0);if(inc<0||vals.some(x=>x<0)){ $('out').textContent='Check the inputs.';return}const spent=vals.reduce((a,b)=>a+b,0),left=inc-spent,rate=inc?left/inc*100:0;$('out').innerHTML='<strong>Remaining: '+left.toLocaleString(undefined,{maximumFractionDigits:2})+'</strong><br>Total spending: '+spent.toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Remaining / potential savings rate: '+rate.toFixed(1)+'%<br><br>50/30/20 reference: '+(inc*.5).toLocaleString()+' needs · '+(inc*.3).toLocaleString()+' wants · '+(inc*.2).toLocaleString()+' savings/debt goals'}$('go').onclick=c;c()</script></body></html>
