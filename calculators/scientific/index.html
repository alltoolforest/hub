<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Use a browser scientific calculator for trigonometry, logarithms, roots, powers and everyday arithmetic."><title>Scientific Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><style>.calc{max-width:520px;margin:auto}.display{width:100%;font-size:26px;padding:16px;border:1px solid var(--line);border-radius:12px;text-align:right}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.keys button{min-height:48px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;cursor:pointer}.keys .op{background:#edf8f1}@media(max-width:420px){.keys{grid-template-columns:repeat(4,1fr)}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel calc"><div class="eyebrow">Math</div><h1>Scientific Calculator</h1><input id="d" class="display" value="0" aria-label="Calculator expression"><div class="keys" id="keys"><button data-v="sin(">sin</button><button data-v="cos(">cos</button><button data-v="tan(">tan</button><button data-v="log(">log</button><button data-v="ln(">ln</button><button data-v="sqrt(">√</button><button data-v="^">xʸ</button><button data-v="pi">π</button><button data-v="e">e</button><button data-a="clear">C</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button data-v="/">÷</button><button data-v="(">(</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button data-v="*">×</button><button data-v=")">)</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="-">−</button><button data-a="back">⌫</button><button data-v="0">0</button><button data-v=".">.</button><button data-v="%">%</button><button data-v="+">+</button><button class="op" data-a="eq">=</button></div><div class="note">Trigonometric functions use degrees. Supports sin, cos, tan, log₁₀, natural log, square root, powers, π and e.</div></div></div></main><script>const d=document.getElementById('d');function ev(s){s=s.replace(/\^/g,'**').replace(/pi/g,'Math.PI').replace(/\be\b/g,'Math.E').replace(/sqrt\(/g,'Math.sqrt(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/sin\(/g,'SIN(').replace(/cos\(/g,'COS(').replace(/tan\(/g,'TAN(').replace(/%/g,'/100');const SIN=x=>Math.sin(x*Math.PI/180),COS=x=>Math.cos(x*Math.PI/180),TAN=x=>Math.tan(x*Math.PI/180);return Function('SIN','COS','TAN','"use strict";return ('+s+')')(SIN,COS,TAN)}document.getElementById('keys').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='clear'){d.value='0';return}if(b.dataset.a==='back'){d.value=d.value.length>1?d.value.slice(0,-1):'0';return}if(b.dataset.a==='eq'){try{const r=ev(d.value);d.value=Number.isFinite(r)?String(r):'Error'}catch{d.value='Error'}return}if(d.value==='0'||d.value==='Error')d.value='';d.value+=b.dataset.v};</script></body></html>
