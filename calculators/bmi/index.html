<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate adult BMI and a standard BMI-based reference weight range."><title>BMI Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:900px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Adult health reference</div><h1>BMI & Healthy Weight</h1><div class="grid"><div class="field"><label>Height (cm)<input id="h" type="number" min="50" max="300" value="170"></label></div><div class="field"><label>Weight (kg)<input id="w" type="number" min="10" max="500" value="70"></label></div></div><button class="primary" id="go">Calculate BMI</button><div class="result" id="out"></div><div class="note">For adults only. BMI is a screening measure, not a diagnosis, and does not directly measure body fat or individual health. Reference range shown uses BMI 18.5–24.9.</div></div></div></main><script>const $=x=>document.getElementById(x);function c(){const h=+$('h').value/100,w=+$('w').value;if(h<=0||w<=0){$('out').textContent='Enter valid height and weight.';return}const b=w/(h*h),lo=18.5*h*h,hi=24.9*h*h,cat=b<18.5?'Below reference range':b<25?'Within reference range':b<30?'Above reference range':'Well above reference range';$('out').innerHTML='<strong>BMI '+b.toFixed(1)+'</strong><br>'+cat+'<br>Reference weight range for this height: '+lo.toFixed(1)+'–'+hi.toFixed(1)+' kg'}$('go').onclick=c;c()</script></body></html>
