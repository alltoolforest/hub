<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Duration Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px}.result strong{font-size:24px}.note{margin-top:14px;color:var(--muted);font-size:13px}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Calculators</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Time</div><h1>Time & Duration Calculator</h1><div class="grid"><div class="field"><label>Mode<select id="mode"><option value="between">Time between</option><option value="add">Add duration</option><option value="sub">Subtract duration</option></select></label></div><div class="field"><label>Start time<input id="start" type="time" value="09:00"></label></div><div class="field" id="endBox"><label>End time<input id="end" type="time" value="17:30"></label></div><div class="field" id="hoursBox" style="display:none"><label>Hours<input id="hours" type="number" min="0" value="2"></label></div><div class="field" id="minsBox" style="display:none"><label>Minutes<input id="mins" type="number" min="0" value="30"></label></div><div class="field"><label>Break minutes<input id="break" type="number" min="0" value="0"></label></div></div><button class="primary" id="go">Calculate</button><div class="result" id="out"></div><div class="note">For “time between”, an end time earlier than the start is treated as the following day. Break time is deducted from the duration.</div></div></div></main><script>const $=x=>document.getElementById(x);function mins(v){const p=v.split(':');return +p[0]*60 + +p[1]}function fmt(n){n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function c(){const m=$('mode').value,s=mins($('start').value),br=+$('break').value||0;if(m==='between'){let e=mins($('end').value);if(e<s)e+=1440;const d=Math.max(0,e-s-br);$('out').innerHTML='<strong>'+Math.floor(d/60)+' h '+(d%60)+' min</strong><br>Decimal hours: '+(d/60).toFixed(2)}else{const d=(+$('hours').value||0)*60+(+$('mins').value||0),r=m==='add'?s+d:s-d;$('out').innerHTML='<strong>'+fmt(r)+'</strong><br>Adjusted by '+Math.floor(d/60)+' h '+d%60+' min'}}function mode(){const b=$('mode').value==='between';$('endBox').style.display=b?'block':'none';$('hoursBox').style.display=$('minsBox').style.display=b?'none':'block';c()}$('mode').onchange=mode;$('go').onclick=c;c()</script></body></html>
