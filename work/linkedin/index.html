<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkedIn Profile Helper — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:100px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px;white-space:pre-wrap}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.note{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Work</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Professional profile</div><h1>LinkedIn Profile Helper</h1><div class="grid"><div class="field"><label>Mode<select id="mode"><option value="headline">Headline</option><option value="about">About section</option><option value="experience">Experience bullet</option><option value="carousel">Carousel outline</option></select></label></div><div class="field"><label>Current / target role<input id="role"></label></div><div class="field"><label>Skills / specialties<input id="skills"></label></div><div class="field"><label>Industry / audience<input id="industry"></label></div><div class="field"><label>Real experience / achievement<textarea id="exp"></textarea></label></div><div class="field"><label>Carousel topic (if applicable)<input id="topic"></label></div></div><button class="primary" id="go">Create draft</button><div class="result" id="out"></div><div class="note">Use only claims that accurately describe you. This local helper structures wording; it does not fabricate credentials or outcomes.</div></div><script>const $=x=>document.getElementById(x),v=x=>$(x).value.trim();$('go').onclick=()=>{let m=v('mode'),r=v('role'),s=v('skills'),i=v('industry'),e=v('exp'),t=v('topic'),x='';if(m==='headline')x=[r,s,i].filter(Boolean).join(' | ');if(m==='about')x='I am '+(r||'a professional')+(i?' working in '+i:'')+'. '+(s?'My areas of focus include '+s+'. ':'')+(e?e+' ':'')+'I value clear, reliable work and continuous professional growth.';if(m==='experience')x=e?'• '+e.replace(/^./,a=>a.toUpperCase()).replace(/[.]?$/,'.'):'Add a real responsibility or achievement first.';if(m==='carousel')x='1. '+(t||'Your topic')+'\n2. Why it matters\n3. Key idea #1\n4. Key idea #2\n5. Practical example\n6. Common mistake\n7. Takeaway / next step';out.textContent=x}</script></div></main></body></html>
