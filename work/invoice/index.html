<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Builder — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:90px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px;white-space:pre-wrap}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.note{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Work</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Freelance</div><h1>Invoice Builder</h1><div class="grid"><div class="field"><label>From<input id="from"></label></div><div class="field"><label>Bill to<input id="to"></label></div><div class="field"><label>Invoice #<input id="num" value="INV-001"></label></div><div class="field"><label>Currency / symbol<input id="cur" value="₹"></label></div><div class="field"><label>Description<input id="desc" value="Professional services"></label></div><div class="field"><label>Quantity<input id="qty" type="number" min="0" value="1"></label></div><div class="field"><label>Rate<input id="rate" type="number" min="0" value="1000"></label></div><div class="field"><label>Discount %<input id="disc" type="number" min="0" max="100" value="0"></label></div><div class="field"><label>Tax %<input id="tax" type="number" min="0" value="0"></label></div><div class="field"><label>Payment terms<input id="terms" value="Due within 15 days"></label></div></div><button class="primary" id="go">Preview invoice</button><button class="primary" id="print" style="margin-left:8px">Print / Save PDF</button><div class="result" id="out"></div><div class="note">Tax treatment and required invoice fields vary by jurisdiction. Verify compliance requirements before issuing.</div></div><script>const $=x=>document.getElementById(x),v=x=>$(x).value;function c(){let sub=(+v('qty')||0)*(+v('rate')||0),after=sub*(1-(+v('disc')||0)/100),tax=after*(+v('tax')||0)/100,total=after+tax,cur=v('cur');out.textContent=(v('from')||'[Your business]')+'\nINVOICE '+v('num')+'\nBill to: '+(v('to')||'[Client]')+'\n\n'+v('desc')+' — '+v('qty')+' × '+cur+v('rate')+'\nSubtotal: '+cur+sub.toFixed(2)+'\nAfter discount: '+cur+after.toFixed(2)+'\nTax: '+cur+tax.toFixed(2)+'\nTOTAL: '+cur+total.toFixed(2)+'\n\n'+v('terms')}$('go').onclick=c;$('print').onclick=()=>{c();window.print()};c()</script></div></main></body></html>
