<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate daily work hours, breaks, weekly totals and overtime with a simple browser timesheet."><title>Timesheet & Work Hours — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:90px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px;white-space:pre-wrap}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.note{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Work</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Time tracking</div><h1>Timesheet & Work Hours</h1><p>Enter up to seven workdays. Leave unused days blank.</p><div id="rows"></div><div class="field" style="max-width:240px;margin-top:12px"><label>Weekly overtime after hours<input id="ot" type="number" min="0" value="40"></label></div><button class="primary" id="go">Calculate week</button><div class="result" id="out"></div></div><script>const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],rows=document.getElementById('rows');rows.innerHTML=days.map((d,i)=>'<div class="grid" style="margin-bottom:8px"><div class="field"><label>'+d+' start<input class="s" type="time"></label></div><div class="field"><label>End<input class="e" type="time"></label></div><div class="field"><label>Break min<input class="b" type="number" min="0" value="0"></label></div></div>').join('');const mm=v=>{let p=v.split(':');return +p[0]*60 + +p[1]};document.getElementById('go').onclick=()=>{let total=0,lines=[];[...rows.children].forEach((r,i)=>{let s=r.querySelector('.s').value,e=r.querySelector('.e').value,b=+r.querySelector('.b').value||0;if(s&&e){let d=mm(e)-mm(s);if(d<0)d+=1440;d=Math.max(0,d-b);total+=d;lines.push(days[i]+': '+(d/60).toFixed(2)+' h')}});let hrs=total/60,threshold=+document.getElementById('ot').value||0,out=document.getElementById('out');out.textContent='Weekly total: '+hrs.toFixed(2)+' h\nRegular: '+Math.min(hrs,threshold).toFixed(2)+' h · Overtime: '+Math.max(0,hrs-threshold).toFixed(2)+' h\n\n'+lines.join('\n')}</script></div></main></body></html>
