<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cover Letter Builder — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:95px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px;white-space:pre-wrap}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.note{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Work</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Applications</div><h1>Cover Letter Builder</h1><div class="grid"><div class="field"><label>Your name<input id="name"></label></div><div class="field"><label>Target role<input id="role"></label></div><div class="field"><label>Company<input id="company"></label></div><div class="field"><label>Relevant experience / study<textarea id="exp"></textarea></label></div><div class="field"><label>Relevant skills<input id="skills"></label></div><div class="field"><label>Why this role/company<textarea id="why"></textarea></label></div></div><button class="primary" id="go">Build letter</button><div class="result" id="out"></div><div class="note">Edit the draft before sending. Keep every claim factual.</div></div><script>const $=x=>document.getElementById(x),v=x=>$(x).value.trim();$('go').onclick=()=>{const role=v('role')||'the advertised role',co=v('company')||'your organization';$('out').textContent='Dear Hiring Manager,\n\nI am writing to express my interest in '+role+' at '+co+'. '+(v('exp')?v('exp')+' ':'')+(v('skills')?'My relevant skills include '+v('skills')+'. ':'')+(v('why')?'I am particularly interested in this opportunity because '+v('why')+'. ':'')+'I would welcome the opportunity to discuss how my background could contribute to the role.\n\nThank you for your time and consideration.\n\nSincerely,\n'+(v('name')||'[Your name]')};</script></div></main></body></html>
