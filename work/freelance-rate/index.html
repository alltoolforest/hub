<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Estimate sustainable freelance hourly and daily rates from income goals, expenses and billable time."><title>Freelance Rate Calculator — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:90px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px;white-space:pre-wrap}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.note{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Work</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Freelance</div><h1>Freelance Rate Calculator</h1><div class="grid"><div class="field"><label>Desired annual personal income<input id="income" type="number" min="0" value="600000"></label></div><div class="field"><label>Annual business expenses<input id="cost" type="number" min="0" value="60000"></label></div><div class="field"><label>Tax / reserve %<input id="reserve" type="number" min="0" max="90" value="20"></label></div><div class="field"><label>Working weeks / year<input id="weeks" type="number" min="1" max="52" value="46"></label></div><div class="field"><label>Hours / week<input id="hours" type="number" min="1" value="40"></label></div><div class="field"><label>Billable time %<input id="bill" type="number" min="1" max="100" value="60"></label></div></div><button class="primary" id="go">Calculate rates</button><div class="result" id="out"></div><div class="note">Planning estimate only. Taxes, demand, scope risk and market pricing vary.</div></div><script>const $=x=>document.getElementById(x);function c(){const i=+$('income').value,e=+$('cost').value,r=+$('reserve').value/100,w=+$('weeks').value,h=+$('hours').value,b=+$('bill').value/100;if([i,e,r,w,h,b].some(x=>x<0)||!w||!h||!b||r>=1){out.textContent='Check the inputs.';return}const need=(i+e)/(1-r),bh=w*h*b,hr=need/bh;out.innerHTML='<strong>Hourly: '+hr.toLocaleString(undefined,{maximumFractionDigits:2})+'</strong><br>8-hour day: '+(hr*8).toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Annual revenue target: '+need.toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Estimated billable hours: '+Math.round(bh)}$('go').onclick=c;c()</script></div></main></body></html>
