<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professional Writing Assistant — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:100px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px;white-space:pre-wrap}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.note{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Work</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Communication</div><h1>Professional Writing Assistant</h1><div class="grid"><div class="field"><label>Message type<select id="type"><option value="email">Professional email</option><option value="follow">Follow-up</option><option value="leave">Leave / permission request</option><option value="resign">Resignation</option><option value="meeting">Meeting follow-up</option><option value="reply">Professional reply</option></select></label></div><div class="field"><label>Tone<select id="tone"><option>Professional</option><option>Friendly</option><option>Concise</option></select></label></div><div class="field"><label>Recipient name / role<input id="who"></label></div><div class="field"><label>Purpose / subject<input id="purpose"></label></div><div class="field"><label>Facts to include<textarea id="facts" placeholder="Write the facts in your own words."></textarea></label></div><div class="field"><label>Request / next step<textarea id="ask"></textarea></label></div></div><button class="primary" id="go">Create draft</button><div class="result" id="out"></div><div class="note">Review names, dates and factual claims before sending. This version is a browser-based structured writing helper, not a generative AI service.</div></div><script>const $=x=>document.getElementById(x),v=x=>$(x).value.trim();$('go').onclick=()=>{let type=v('type'),who=v('who')||'there',p=v('purpose'),f=v('facts'),a=v('ask'),tone=v('tone'),open=tone==='Friendly'?'Hi ':'Dear ',body='';if(type==='follow')body='I am following up'+(p?' regarding '+p:'')+'.';else if(type==='leave')body='I am writing to request '+(p||'leave / permission')+'.';else if(type==='resign')body='Please accept this message as formal notice of my resignation'+(p?' '+p:'')+'.';else if(type==='meeting')body='Thank you for the discussion'+(p?' regarding '+p:'')+'.';else if(type==='reply')body='Thank you for your message'+(p?' regarding '+p:'')+'.';else body='I am writing'+(p?' regarding '+p:'')+'.';out.textContent=open+who+',\n\n'+body+(f?' '+f:'')+(a?'\n\n'+a:'')+'\n\n'+(tone==='Friendly'?'Thanks,':'Regards,')+'\n[Your name]'}</script></div></main></body></html>
