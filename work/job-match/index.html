<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATS & Job Match Analyzer — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:95px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px;white-space:pre-wrap}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.note{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Work</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Job search</div><h1>ATS & Job Match Analyzer</h1><div class="grid"><div class="field"><label>Resume text<textarea id="resume"></textarea></label></div><div class="field"><label>Job description<textarea id="job"></textarea></label></div></div><button class="primary" id="go">Analyze match</button><div class="result" id="out">Paste both texts to begin.</div><div class="note">This is a transparent text/keyword comparison—not an employer ATS score and not a prediction of hiring success.</div></div><script>const stop=new Set('the a an and or to of in for with on at by from is are be as this that you your our we will have has required preferred experience years role job work'.split(' '));function words(s){return s.toLowerCase().replace(/[^a-z0-9+#. -]/g,' ').split(/\s+/).filter(x=>x.length>2&&!stop.has(x))}document.getElementById('go').onclick=()=>{const r=document.getElementById('resume').value,j=document.getElementById('job').value;if(!r.trim()||!j.trim()){out.textContent='Paste both resume and job-description text.';return}const rs=new Set(words(r)),freq={};words(j).forEach(w=>freq[w]=(freq[w]||0)+1);const keys=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,30),found=keys.filter(x=>rs.has(x)),missing=keys.filter(x=>!rs.has(x));out.textContent='Important terms found ('+found.length+'): '+(found.join(', ')||'None detected')+'\n\nPotentially missing terms: '+(missing.join(', ')||'None detected')+'\n\nOnly add missing terms when they truthfully describe your experience or skills.'}</script></div></main></body></html>
