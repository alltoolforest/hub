<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Build resume objectives, professional summaries and experience bullets from your real career information."><title>Resume Studio — AllToolForest</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:940px;margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:95px}.result{margin-top:18px;padding:18px;background:#edf8f1;border-radius:14px;white-space:pre-wrap}.primary{padding:12px 18px;border:0;border-radius:10px;background:var(--forest-700);color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.note{color:var(--muted);font-size:13px;margin-top:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../">Work</a></nav></div></header><main class="container"><div class="shell"><div class="panel"><div class="eyebrow">Career</div><h1>Resume Studio</h1><p>Start with the wording helpers below. Use only facts that are true for you.</p><div class="grid"><div class="field"><label>Mode<select id="mode"><option value="objective">Career objective</option><option value="summary">Professional summary</option><option value="bullet">Experience bullet</option></select></label></div><div class="field"><label>Current / recent role<input id="role" placeholder="Customer Support Associate"></label></div><div class="field"><label>Years of experience<input id="years" placeholder="2"></label></div><div class="field"><label>Education / area of study<input id="study" placeholder="B.Tech in Electrical & Electronics Engineering"></label></div><div class="field"><label>Key skills<input id="skills" placeholder="customer handling, communication, Excel"></label></div><div class="field"><label>Target role / field<input id="target" placeholder="Quality Analyst"></label></div><div class="field"><label>Real work / achievement<textarea id="work" placeholder="Describe what you actually did. Add numbers only if they are real."></textarea></label></div></div><button class="primary" id="go">Create draft</button><div class="result" id="out">Your editable draft will appear here.</div><div class="note">This local helper structures your information; it does not verify facts or invent qualifications.</div></div><script>const $=x=>document.getElementById(x),v=x=>$(x).value.trim();function c(){let role=v('role'),years=v('years'),study=v('study'),skills=v('skills'),target=v('target'),work=v('work'),m=v('mode'),s='';if(m==='objective')s=(study?study+' graduate':'Professional')+(role?' with experience as '+role:'')+(years?' and '+years+' years of experience':'')+(skills?', bringing skills in '+skills:'')+(target?', seeking an opportunity in '+target:'')+'. Focused on contributing reliable work while continuing to develop professionally.';if(m==='summary')s=(role||'Professional')+(years?' with '+years+' years of experience':'')+(skills?' across '+skills:'')+(work?'. Experience includes '+work:'')+(target?'. Interested in opportunities related to '+target:'')+'.';if(m==='bullet')s=work?('• '+work.replace(/^./,x=>x.toUpperCase()).replace(/[.]?$/,'.')):'Describe a real responsibility or achievement first.';$('out').textContent=s.replace(/\s+/g,' ')}$('go').onclick=c;</script></div></main></body></html>
