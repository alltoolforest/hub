<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to JPG / PNG — AllToolForest</title><meta name="description" content="Convert PDF pages to JPG or PNG images locally in your browser."><link rel="stylesheet" href="../../assets/css/main.css"><style>.shell{max-width:850px;margin:42px auto 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}.crumbs{font-size:14px;color:var(--muted);margin-bottom:18px}.drop{border:2px dashed #b9d8c7;border-radius:16px;padding:38px 20px;text-align:center;background:#f7fbf8;cursor:pointer}.drop input{display:none}.opts{display:none;margin-top:18px}.opts.show{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row label{font-size:13px;font-weight:700}.row select{width:100%;padding:10px;margin-top:5px;border:1px solid var(--line);border-radius:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.primary,.secondary{padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}.primary{border:0;background:var(--forest-700);color:#fff}.secondary{border:1px solid var(--forest-700);background:#fff;color:var(--forest-700)}.status{margin-top:14px;color:var(--muted)}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}.result{border:1px solid var(--line);border-radius:10px;padding:8px}.result img{width:100%;height:160px;object-fit:contain;background:#f5f5f5}.result a{display:block;text-align:center;margin-top:7px;color:var(--forest-700);font-weight:700}.note{margin-top:18px;padding:13px 15px;background:#edf8f1;border-radius:12px;font-size:13px}@media(max-width:600px){.row{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="../../"><span class="brand-mark">AF</span><span>AllToolForest</span></a><nav class="nav"><a href="../../">Home</a><a href="../">Documents</a></nav></div></header><main class="container"><div class="shell"><div class="crumbs"><a href="../../">Home</a> / <a href="../">Documents</a> / PDF to Images</div><div class="panel"><div class="eyebrow">🖼️ Local conversion</div><h1>PDF to JPG / PNG</h1><p>Render each PDF page as an image without intentionally uploading the document.</p><div class="drop" id="drop"><strong>Drop a PDF here</strong><div>or click to choose one</div><input id="input" type="file" accept="application/pdf,.pdf"></div><div class="opts" id="opts"><div class="row"><label>Image format<select id="format"><option value="jpeg">JPG</option><option value="png">PNG</option></select></label><label>Quality / resolution<select id="scale"><option value="1.25">Standard</option><option value="1.75" selected>High</option><option value="2.5">Very high</option></select></label></div><div class="actions"><button class="primary" id="convert">Convert pages</button><button class="secondary" id="change">Choose another PDF</button></div></div><div class="status" id="status"></div><div class="results" id="results"></div><div class="note"><strong>Privacy:</strong> PDF rendering happens inside this browser using PDF.js.</div></div></div></main><script>const $=x=>document.getElementById(x),drop=$('drop'),input=$('input'),opts=$('opts'),status=$('status'),results=$('results');let file=null,urls=[],pdfReady=null;function loadPdf(){if(window.pdfjsLib)return Promise.resolve();if(pdfReady)return pdfReady;status.textContent='Loading PDF engine…';pdfReady=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok()};s.onerror=no;document.head.appendChild(s)});return pdfReady}function clearUrls(){urls.forEach(URL.revokeObjectURL);urls=[]}function load(f){if(!f||(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name))){status.textContent='Please choose a PDF.';return}file=f;opts.classList.add('show');results.innerHTML='';clearUrls();status.textContent='Loaded '+f.name+(f.size>100*1024*1024?' · Large files may use significant memory.':'')}drop.onclick=()=>input.click();input.onchange=e=>{load(e.target.files[0]);input.value=''};['dragenter','dragover','dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>e.preventDefault()));drop.ondrop=e=>load(e.dataTransfer.files[0]);$('change').onclick=()=>input.click();$('convert').onclick=async()=>{if(!file)return;const btn=$('convert');btn.disabled=true;results.innerHTML='';clearUrls();status.textContent='Rendering pages…';try{await loadPdf();const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,fmt=$('format').value,requested=+$('scale').value,scale=innerWidth<=780?Math.min(requested,1.25):requested;for(let i=1;i<=pdf.numPages;i++){status.textContent='Rendering page '+i+' of '+pdf.numPages+'…';const p=await pdf.getPage(i),vp=p.getViewport({scale}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const blob=await new Promise(r=>c.toBlob(r,fmt==='png'?'image/png':'image/jpeg',.9)),url=URL.createObjectURL(blob);urls.push(url);const card=document.createElement('div');card.className='result';const img=document.createElement('img');img.src=url;const a=document.createElement('a');a.href=url;a.download='page-'+i+'.'+(fmt==='png'?'png':'jpg');a.textContent='Download page '+i;card.append(img,a);results.append(card);c.width=c.height=1}status.textContent='Converted '+pdf.numPages+' page'+(pdf.numPages===1?'':'s')+'.'}catch(e){console.error(e);status.textContent='Could not convert this PDF. Protected or damaged PDFs may not be supported.'}finally{btn.disabled=false}};</script></body></html>
